<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica Virtual</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: #0d1527;
    color: #e2e8f0;
    overflow-x: hidden;
    line-height: 1.5;
}

/* TOPBAR / HEADLINE */
.top-headline {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
    background: rgba(10, 18, 38, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.headline-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.station-status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #34d399;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
}

.status-dot-live {
    width: 8px;
    height: 8px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
    animation: blink 1.8s infinite ease-in-out;
}

@keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
}

.station-title-text {
    font-size: 0.95rem;
    color: #d6e0ee;
    font-weight: 500;
}

/* Container do widget de clima no topo */
.seasons-gif-container {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 14px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.seasons-gif-container span {
    font-size: 0.82rem;
    color: #cbd5e1;
    font-weight: 500;
}

/* Área que segura os 4 ícones sobrepostos */
.weather-icon-rotator {
    position: relative;
    width: 26px;
    height: 26px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.weather-icon {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transform: translateY(6px) scale(0.85);
    transition: opacity 0.5s ease, transform 0.5s ease;
}

/* Estado ativo (ícone visível) */
.weather-icon.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    animation: floatIcon 3s ease-in-out infinite alternate;
}

@keyframes floatIcon {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-2px) scale(1.05); }
}

/* HERO VIEWPORT (100vh COM A BOLA QUE PULSA) */
.hero-viewport {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    background: radial-gradient(circle at center, #1b315e 0%, #0c162d 70%, #060b17 100%);
    overflow: hidden;
}

.pulsing-sphere-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: clamp(280px, 42vw, 480px);
    height: clamp(280px, 42vw, 480px);
}

.pulse-wave {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(96, 165, 250, 0.35);
    width: 100%;
    height: 100%;
    animation: pulseWaveExpand 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    pointer-events: none;
}

.pulse-wave:nth-child(2) { animation-delay: 1.1s; }
.pulse-wave:nth-child(3) { animation-delay: 2.2s; }

@keyframes pulseWaveExpand {
    0% { transform: scale(0.7); opacity: 0.8; }
    100% { transform: scale(1.6); opacity: 0; }
}

.center-sphere {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #1d4ed8 55%, #1e3a8a 85%, #0f172a 100%);
    box-shadow: 
        0 0 50px rgba(59, 130, 246, 0.4),
        inset 0 0 30px rgba(255, 255, 255, 0.25),
        inset 0 -15px 30px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
    animation: sphereGlowPulse 4s ease-in-out infinite alternate;
}

@keyframes sphereGlowPulse {
    0% { transform: scale(0.98); }
    100% { transform: scale(1.03); }
}

.center-sphere h1 {
    color: #ffffff;
    font-size: clamp(1.2rem, 2.5vw, 1.85rem);
    font-weight: 700;
    line-height: 1.35;
}

.scroll-indicator-down {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #94a3b8;
    text-decoration: none;
    font-size: 1.2rem;
}

.scroll-arrow {
    width: 14px;
    height: 14px;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    animation: bounceArrow 2s infinite;
}

@keyframes bounceArrow {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0) rotate(45deg); }
    40% { transform: translateY(6px) rotate(45deg); }
}

/* CONTAINER DE MEDIÇÕES */
.measurements-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 60px 20px 80px 20px;
}

.card-measurement {
    background: #131f37;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 32px;
}

.card-measurement h2 {
    font-size: 1.3rem;
    color: #60a5fa;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.loading-placeholder {
    color: #64748b;
    font-style: italic;
    padding: 12px 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.loading-spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ESTILIZAÇÃO DAS TABELAS GERADAS PELO JS */
.table-container {
    width: 100%;
    overflow-x: auto;
}

.latest-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
}

.latest-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    padding: 14px 18px;
    border-radius: 10px;
}

.latest-item label {
    display: block;
    font-size: 0.8rem;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.latest-item span {
    font-size: 1.1rem;
    font-weight: 600;
    color: #f8fafc;
}

.table-container table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    text-align: left;
}

.table-container th {
    background-color: rgba(255, 255, 255, 0.04);
    color: #94a3b8;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.table-container td {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    color: #e2e8f0;
    font-size: 0.95rem;
}

.table-container tr:hover {
    background-color: rgba(255, 255, 255, 0.02);
}
    </style>
</head>
<body>

    <!-- HEADLINE SUPERIOR -->
    <header class="top-headline">
    <div class="headline-brand">
        <span class="station-title-text">Estação Meteorológica Virtual</span>
    </div>

    <!-- Widget animado que altera entre Sol, Nuvem, Chuva e Vento -->
   <div class="seasons-gif-container" title="Estações do Ano">
    <div class="weather-icon-rotator">
        <!-- 1. Sol -->
        <svg class="weather-icon active" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m18.07 4.93-1.41 1.41"></path>
        </svg>

        <!-- 2. Nuvem sem chuva -->
        <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
        </svg>

        <!-- 3. Nuvem com chuva -->
        <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>
            <path d="M8 19v2"></path>
            <path d="M12 18v3"></path>
            <path d="M16 19v2"></path>
        </svg>

        <!-- 4. Nuvem com raio (Tempestade) -->
        <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 16.9A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 3 16.3"></path>
            <polyline points="13 11 9 17 15 17 11 23"></polyline>
        </svg>

        <!-- 5. Vento -->
        <svg class="weather-icon" viewBox="0 0 24 24" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"></path>
            <path d="M9.6 4.6A2 2 0 1 1 11 8H2"></path>
            <path d="M12.6 19.4A2.5 2.5 0 1 0 14 15H2"></path>
        </svg>
    </div>
    <span id="weather-label">Estações</span>
</div>
        
</header>

    <!-- INÍCIO INICIAL (100VH VIEWPORT COM A BOLA QUE PULSA) -->
    <section class="hero-viewport">
        <div class="pulsing-sphere-wrapper">
            <div class="pulse-wave"></div>
            <div class="pulse-wave"></div>
            <div class="pulse-wave"></div>

            <div class="center-sphere">
                <h1>Acompanhe aqui o clima da nossa cidade</h1>
            </div>
        </div>

        <a href="#medicoes" class="scroll-indicator-down">
            <span>Ver medições</span>
            <div class="scroll-arrow"></div>
        </a>
    </section>

    <!-- SECÇÕES DAS MEDIÇÕES -->
    <main id="medicoes" class="measurements-container">

        <!-- 1. Última Medição -->
        <section class="card-measurement">
            <h2>Última medição</h2>
            <div id="ultimo" class="table-container">
                <div class="loading-placeholder">
                    <div class="loading-spinner"></div>
                    <span>Carregando dados da API...</span>
                </div>
            </div>
        </section>

        <!-- 2. Medição do Dia -->
        <section class="card-measurement">
            <h2>Medição do dia</h2>
            <div id="dia" class="table-container">
                <div class="loading-placeholder">
                    <div class="loading-spinner"></div>
                    <span>Carregando dados da API...</span>
                </div>
            </div>
        </section>

        <!-- 3. Medição da Semana -->
        <section class="card-measurement">
            <h2>Medição da semana</h2>
            <div id="semana" class="table-container">
                <div class="loading-placeholder">
                    <div class="loading-spinner"></div>
                    <span>Carregando dados da API...</span>
                </div>
            </div>
        </section>

        <!-- 4. Medição do Mês -->
        <section class="card-measurement">
            <h2>Medição do mês</h2>
            <div id="mes" class="table-container">
                <div class="loading-placeholder">
                    <div class="loading-spinner"></div>
                    <span>Carregando dados da API...</span>
                </div>
            </div>
        </section>

    </main>
      <script>
        //bota a sua chave da API aqui!!!
const API_KEY = "apresentacao";

//URL que busca do servidor, NÃO MUDE
const API_URL = "https://weathermonitor-6b78.onrender.com";

//funções que buscam os dados do servidor
//pega a ultima medição
async function buscarUltimo() {
    const resposta = await fetch(
        API_URL + "/measurements/latest",
        {
            headers: {
                "X-API-Key": API_KEY
            }
        }
    );
    const dados = await resposta.json();
    document.getElementById("ultimo").innerHTML = `
        <p>Temperatura: ${dados.temperature} °C</p>
        <p>Umidade: ${dados.humidity} %</p>
        <p>Pressão: ${dados.pressure} hPa</p>
        <p>Luminosidade: ${dados.luminosity}</p>
        <p>Chuva: ${dados.raindrop}</p>
        <p>Data: ${formatarData(dados.timestamp)}</p>
    `;
}

//pega a medição de um dia especifico/dia atual se não tiver parametro
//aceita o formato YYYY-MM-DD
async function buscarDia(data) {
    let url = API_URL + "/measurements/day";
    if (data != null) {
        url += "?date=" + data;
    }
    const resposta = await fetch(
        url,
        {
            headers: {
                "X-API-Key": API_KEY
            }
        }
    );
    const dados = await resposta.json();
    document.getElementById("dia").innerHTML =
        criarTabela(dados);
}

//pega a medição dos ultimos 7 dias
async function buscarSemana() {
    const resposta = await fetch(
        API_URL + "/measurements/week",
        {
            headers: {
                "X-API-Key": API_KEY
            }
        }
    );
    const dados = await resposta.json();
    document.getElementById("semana").innerHTML =
        criarTabela(dados);
}

//pega a medição de um mes especifico/ultimos 30dias se não tiver parametro
//recebe mes e ano no formato YYYY-MM
async function buscarMes(data) {
    let url = API_URL + "/measurements/month";
    if (data != null) {
        let [ano, mes] = data.split("-");
        if (ano.length != 4 || mes.length != 2) {
            alert("Formato invalido. Use YYYY-MM");
            return;
        }
        url += "?month=" + mes + "&year=" + ano;
    }
    const resposta = await fetch(
        url,
        {
            headers: {
                "X-API-Key": API_KEY
            }
        }
    );
    const dados = await resposta.json();
    document.getElementById("mes").innerHTML =
        criarTabela(dados);
}

//pode ser personalizado com id ou classes para estilizar a tabela
//exemplo: <th class="temp">Temperatura</th>,
//tbm serve pro td <td>${formatarData(medicao.timestamp)}</td> pode inserir id, classes, span, divs, etc
function criarTabela(dados) {
    let tabela = `
        <table>
            <tr>
                <th>Data</th>
                <th>Temperatura</th>
                <th>Umidade</th>
                <th>Pressão</th>
                <th>Luminosidade</th>
                <th>Chuva</th>
            </tr>
    `;
    dados.forEach(medicao => {
        tabela += `
            <tr>
                <td>${formatarData(medicao.timestamp)}</td>
                <td>${medicao.temperature} °C</td>
                <td>${medicao.humidity} %</td>
                <td>${medicao.pressure} hPa</td>
                <td>${medicao.luminosity}</td>
                <td>${medicao.raindrop}</td>
            </tr>
        `;

    });
    tabela += `
        </table>
    `;
    return tabela;
}

//formata a data para o padrao br DD/MM/YYYY HH:MM:SS
function formatarData(data) {
    return new Date(data).toLocaleString("pt-BR");
}

//chama as funções para buscar os dados do servidor
buscarUltimo();
//aceita formato YYYY-MM-DD
buscarDia("2026-09-10");
//por enquanto, busca apenas a ultima semana, mas dps vai receber parametro com a data final da semana
buscarSemana();
//aceita formato YYYY-MM
//buscarMes("2026-09");
buscarMes();

// Alternador automático de ícones (Sol -> Nuvem -> Chuva -> Vento)
function iniciarAnimacaoEstacoes() {
    const icones = document.querySelectorAll('.weather-icon-rotator .weather-icon');
    if (!icones.length) return;

    let indexAtual = 0;

    setInterval(() => {
        icones[indexAtual].classList.remove('active');
        indexAtual = (indexAtual + 1) % icones.length;
        icones[indexAtual].classList.add('active');
    }, 2000); // troca a cada 2 segundos
}

// Inicia junto do carregamento da página
document.addEventListener("DOMContentLoaded", () => {
    iniciarAnimacaoEstacoes();
});
      </script>
</body>
</html>
